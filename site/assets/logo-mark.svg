<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mycelium">
  <title>mycelium — the network under the stack</title>
  <defs>
    <linearGradient id="mcy-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset=".45" stop-color="#8B2FC9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="mcy-cap-deep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B2FC9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".0"/>
    </linearGradient>
    <radialGradient id="mcy-shine" cx=".38" cy=".28" r=".45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mcy-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="mcy-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF2E88" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#8B2FC9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B2FC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mcy-ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A3E635" stop-opacity=".35"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- aura -->
  <circle cx="32" cy="28" r="24" fill="url(#mcy-glow)">
    <animate attributeName="r" values="22;27;22" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".75;1;.75" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit ring: tiny spores circling the cap -->
  <g fill="#FBBF24">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 32 26" to="360 32 26" dur="24s" repeatCount="indefinite"/>
      <circle cx="32" cy="8" r=".9" opacity=".9"/>
      <circle cx="50" cy="26" r=".7" opacity=".6"/>
      <circle cx="14" cy="26" r=".7" opacity=".6"/>
      <circle cx="45" cy="44" r=".5" opacity=".4"/>
    </g>
  </g>

  <!-- ground glow -->
  <ellipse cx="32" cy="57" rx="22" ry="5" fill="url(#mcy-ground)">
    <animate attributeName="rx" values="20;24;20" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- mycelium threads: branching, tapering, rippling -->
  <g stroke-linecap="round" fill="none">
    <path d="M22 55 Q32 60 42 55" stroke="#A3E635" stroke-width="2" opacity=".95">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite"
        values="M22 55 Q32 60 42 55; M22 55 Q32 62 42 55; M22 55 Q32 60 42 55"/>
    </path>
    <path d="M15 58 Q32 53 49 58" stroke="#A3E635" stroke-width="1.4" opacity=".55"/>
    <path d="M25 61 Q32 58 39 61" stroke="#8B2FC9" stroke-width="1.2" opacity=".5"/>
    <path d="M22 55 L18 60" stroke="#A3E635" stroke-width="1.2" opacity=".7"/>
    <path d="M42 55 L46 60" stroke="#A3E635" stroke-width="1.2" opacity=".7"/>
    <path d="M32 57 L32 62" stroke="#A3E635" stroke-width="1.2" opacity=".7"/>
  </g>
  <g fill="#A3E635">
    <circle cx="18" cy="60" r="1.3"/>
    <circle cx="46" cy="60" r="1.3"/>
    <circle cx="32" cy="62" r="1.1"/>
    <circle cx="22" cy="55" r="1.1" opacity=".8"/>
    <circle cx="42" cy="55" r="1.1" opacity=".8"/>
  </g>

  <!-- the mushroom -->
  <g>
    <!-- cap -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.045 .955;1 1" dur="2.9s" repeatCount="indefinite" additive="sum"/>
      <path d="M32 41 C22 41 11 34 11 24 C11 15.5 20 9 32 9 C44 9 53 15.5 53 24 C53 34 42 41 32 41 Z" fill="url(#mcy-cap)"/>
      <path d="M32 41 C22 41 11 34 11 24 C11 15.5 20 9 32 9 C44 9 53 15.5 53 24 C53 34 42 41 32 41 Z" fill="url(#mcy-cap-deep)" opacity=".45"/>
      <path d="M32 41 C22 41 11 34 11 24 C11 15.5 20 9 32 9 C44 9 53 15.5 53 24 C53 34 42 41 32 41 Z" fill="url(#mcy-shine)"/>
      <!-- gills under the cap edge -->
      <g stroke="#0B0014" stroke-width=".8" opacity=".45">
        <path d="M17 33 Q32 43 47 33" fill="none"/>
        <path d="M20 34.5 Q32 41.5 44 34.5" fill="none"/>
      </g>
      <!-- spots: void-purple with cyan pupils -->
      <g>
        <circle cx="21" cy="21" r="4" fill="#0B0014" opacity=".9"/>
        <circle cx="21" cy="21" r="1.7" fill="#22D3EE"/>
        <circle cx="39" cy="18" r="3.1" fill="#0B0014" opacity=".9"/>
        <circle cx="39" cy="18" r="1.3" fill="#22D3EE"/>
        <circle cx="46" cy="27" r="2.5" fill="#0B0014" opacity=".9"/>
        <circle cx="46" cy="27" r="1.05" fill="#22D3EE"/>
        <circle cx="26" cy="30" r="2.2" fill="#0B0014" opacity=".9"/>
        <circle cx="26" cy="30" r=".9" fill="#22D3EE"/>
        <circle cx="33" cy="14" r="1.7" fill="#0B0014" opacity=".9"/>
        <circle cx="33" cy="14" r=".7" fill="#22D3EE"/>
      </g>
    </g>
    <!-- stem with skirt ring -->
    <path d="M28 40 L36 40 L34.2 55.5 L29.8 55.5 Z" fill="url(#mcy-stem)"/>
    <path d="M27.8 45 Q32 47.5 36.2 45 L36 43.5 Q32 46 28 43.5 Z" fill="#FFF3E2" opacity=".9"/>
    <ellipse cx="32" cy="55.5" rx="8" ry="1.8" fill="#FFF3E2" opacity=".9"/>
  </g>

  <!-- spores drifting up -->
  <g fill="#FBBF24">
    <circle cx="17" cy="14" r="1.5">
      <animate attributeName="cy" values="16;2;16" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="47" cy="18" r="1.2">
      <animate attributeName="cy" values="20;5;20" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="33" cy="7" r="1">
      <animate attributeName="cy" values="9;0;9" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="53" cy="30" r="1.1">
      <animate attributeName="cy" values="32;17;32" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="11" cy="32" r=".9">
      <animate attributeName="cy" values="34;20;34" dur="3.6s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur="3.6s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="6" r=".8">
      <animate attributeName="cy" values="8;0;8" dur="3.1s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="3.1s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
