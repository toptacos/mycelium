    <linearGradient id="b-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/><stop offset=".55" stop-color="#8B2FC9"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="b-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF2E88" stop-opacity=".28"/><stop offset="1" stop-color="#FF2E88" stop-opacity="0"/>
