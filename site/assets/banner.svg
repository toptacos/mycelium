<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="mycelium">
  <title>mycelium — repo banner</title>
  <defs>
    <linearGradient id="b-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E88"/><stop offset=".45" stop-color="#8B2FC9"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="b-shine" cx=".38" cy=".28" r=".45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2"/><stop offset="1" stop-color="#FBBF24"/>
