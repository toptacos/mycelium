  <text x="460" y="290" font-family="'Space Grotesk','Inter',sans-serif" font-size="96" font-weight="600" fill="url(#b-word)" letter-spacing="-2">mycelium</text>
  <text x="462" y="352" font-family="'Space Grotesk','Inter',sans-serif" font-size="34" fill="#C4B5FD">local-first agent workstation</text>
  <text x="462" y="404" font-family="'Inter',sans-serif" font-size="24" fill="#5A6B62">scaffold · research · content · integrations · workflows — on your machine</text>
