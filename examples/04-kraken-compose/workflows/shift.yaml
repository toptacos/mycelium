name: shift
description: >-
  One environment shift: mycelium doctors the agent workstation, Kraken
  doctors plugins and plans compose, both write a status report. No
  containers start. Optional LLM summary with --input summarize=1.

inputs:
  summarize:
    default: ""
    description: set to 1 to add a local-model briefing of the report

steps:
  - id: kraken-doctor
    tool: run_command
    args:
      command: "kraken doctor"
      timeout_s: 60

  - id: kraken-list
    tool: run_command
    args:
      command: "kraken list"
      timeout_s: 30

  - id: mcy-doctor
    tool: run_command
    args:
      command: "bin/mcy doctor"
      timeout_s: 60

  - id: ollama
    tool: run_command
    args:
      command: "ollama --version"
      timeout_s: 15
    on_error: continue

  - id: docker
    tool: run_command
    args:
      command: "docker version --format {{.Client.Version}}"
      timeout_s: 20
    on_error: continue

  - id: kraken-stack
    tool: run_command
    args:
      command: "kraken workflow run workflows/kraken-stack.yaml"
      timeout_s: 90
    on_error: fail

  - id: compose-plan
    tool: run_command
    args:
      command: "kraken up --file compose.yaml"
      timeout_s: 30

  - id: policy
    tool: remember
    args:
      text: >-
        Reef environment policy: KRAKEN_OFFLINE=1, docker.public=false,
        expose/tunnel/llm grants off, kraken up is plan-only unless the
        operator passes --start, binds stay on 127.0.0.1.
      kind: preference
      tags: ["reef", "kraken", "docker"]

  - id: recall
    tool: recall_memory
    args:
      query: "reef docker policy"
      k: 3

  - id: report
    tool: fs_write
    args:
      path: "ENVIRONMENT.md"
      content: |
        # Reef environment shift

        Generated by mycelium workflow `shift`, with Kraken as the plugin runner.
        Containers were **not** started.

        ## Agent workstation (mycelium)

        ```
        {{steps.mcy-doctor.output}}
        ```

        ## Plugin runner (Kraken doctor)

        ```
        {{steps.kraken-doctor.output}}
        ```

        ## Installed arms

        ```
        {{steps.kraken-list.output}}
        ```

        ## Host + inventory + notes (kraken-stack)

        ```
        {{steps.kraken-stack.output}}
        ```

        ## Compose plan (`kraken up --file compose.yaml`)

        ```
        {{steps.compose-plan.output}}
        ```

        ## Sidecars

        - ollama: {{steps.ollama.output}}
        - docker: {{steps.docker.output}}

        ## Recalled policy

        {{steps.recall.output}}

        ## Operator next

        1. Read this file.
        2. If you mean to start the stack: unset KRAKEN_OFFLINE and run `kraken up --file compose.yaml --start`.
        3. Otherwise leave the plan on disk and exit.

  - id: brief
    llm: |
      Write a short operator briefing (under 12 lines) from this environment report.
      Name what is healthy, what is plan-only, and the one command that would start containers.
      Report:
      {{steps.report.output}}
    when: "{{inputs.summarize}}"
    on_error: continue
