<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mycelium">
  <title>mycelium</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset=".5" stop-color="#8B2FC9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF2E88" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <circle cx="32" cy="30" r="26" fill="url(#glow)">
    <animate attributeName="r" values="24;28;24" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#A3E635" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M20 56 Q32 60 44 56">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
        values="M20 56 Q32 60 44 56; M20 56 Q32 63 44 56; M20 56 Q32 60 44 56"/>
    </path>
    <path d="M14 59 Q32 55 50 59" opacity=".55"/>
    <path d="M24 61 Q32 57 40 61" opacity=".35"/>
  </g>

  <g>
    <path d="M32 40 C22 40 12 34 12 24 C12 16 20 10 32 10 C44 10 52 16 52 24 C52 34 42 40 32 40 Z"
          fill="url(#cap)">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.04 .96;1 1" dur="2.8s" repeatCount="indefinite" additive="sum"/>
    </path>
    <g fill="#0B0014" opacity=".85">
      <circle cx="22" cy="21" r="3.4"/>
      <circle cx="38" cy="19" r="2.6"/>
      <circle cx="44" cy="27" r="2.2"/>
      <circle cx="27" cy="29" r="2.0"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="22" cy="21" r="1.5"/>
      <circle cx="38" cy="19" r="1.2"/>
      <circle cx="44" cy="27" r="1.0"/>
      <circle cx="27" cy="29" r=".9"/>
    </g>
    <path d="M28 40 L36 40 L34 56 L30 56 Z" fill="url(#stem)"/>
    <ellipse cx="32" cy="56" rx="12" ry="2.4" fill="#FFF3E2" opacity=".85"/>
  </g>

  <g fill="#FBBF24">
    <circle cx="18" cy="12" r="1.4">
      <animate attributeName="cy" values="14;4;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="16" r="1.1">
      <animate attributeName="cy" values="16;6;16" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="8" r="0.9">
      <animate attributeName="cy" values="10;2;10" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="2.6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="30" r="1">
      <animate attributeName="cy" values="30;20;30" dur="4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
