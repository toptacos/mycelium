<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="mycelium — plant it once, it grows">
  <title>mycelium — plant it once. it grows.</title>
  <defs>
    <g id="sc-mush">
      <path d="M32 41 C22 41 11 34 11 24 C11 15.5 20 9 32 9 C44 9 53 15.5 53 24 C53 34 42 41 32 41 Z" fill="url(#sc-cap)"/>
      <path d="M32 41 C22 41 11 34 11 24 C11 15.5 20 9 32 9 C44 9 53 15.5 53 24 C53 34 42 41 32 41 Z" fill="url(#sc-shine)"/>
      <g fill="#0B0014" opacity=".9">
        <circle cx="21" cy="21" r="4"/><circle cx="39" cy="18" r="3.1"/>
        <circle cx="46" cy="27" r="2.5"/><circle cx="26" cy="30" r="2.2"/>
      </g>
      <g fill="#22D3EE">
        <circle cx="21" cy="21" r="1.7"/><circle cx="39" cy="18" r="1.3"/>
        <circle cx="46" cy="27" r="1.05"/><circle cx="26" cy="30" r=".9"/>
      </g>
      <path d="M28 40 L36 40 L34.2 55.5 L29.8 55.5 Z" fill="url(#sc-stem)"/>
      <path d="M27.8 45 Q32 47.5 36.2 45 L36 43.5 Q32 46 28 43.5 Z" fill="#FFF3E2" opacity=".9"/>
      <ellipse cx="32" cy="55.5" rx="8" ry="1.8" fill="#FFF3E2" opacity=".9"/>
      <g stroke-linecap="round" fill="none">
        <path d="M22 55 Q32 60 42 55" stroke="#A3E635" stroke-width="2"/>
        <path d="M15 58 Q32 53 49 58" stroke="#A3E635" stroke-width="1.4" opacity=".55"/>
      </g>
    </g>
    <linearGradient id="sc-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E88"/><stop offset=".45" stop-color="#8B2FC9"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="sc-shine" cx=".38" cy=".28" r=".45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E2"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="sc-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/><stop offset=".55" stop-color="#8B2FC9"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="sc-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF2E88" stop-opacity=".3"/><stop offset="1" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0014"/>
  <circle cx="1010" cy="90" r="340" fill="url(#sc-glow)"/>
  <circle cx="120" cy="600" r="300" fill="url(#sc-glow2)"/>

  <g transform="translate(88,182) scale(4.1)">
    <circle cx="32" cy="28" r="23" fill="url(#sc-glow)"/>
    <use href="#sc-mush"/>
    <g fill="#FBBF24">
      <circle cx="17" cy="14" r="1.5"/><circle cx="47" cy="18" r="1.2"/><circle cx="33" cy="7" r="1"/>
    </g>
  </g>

  <text x="400" y="248" font-family="'Space Grotesk','Inter',sans-serif" font-size="86" font-weight="600" fill="url(#sc-word)" letter-spacing="-1">mycelium</text>
  <text x="402" y="326" font-family="'Space Grotesk','Inter',sans-serif" font-size="40" fill="#FFF3E2">Plant it once. It grows.</text>
  <text x="402" y="392" font-family="'Inter',sans-serif" font-size="26" fill="#C4B5FD">A local-first agent workstation: scaffold, research, content,</text>
  <text x="402" y="428" font-family="'Inter',sans-serif" font-size="26" fill="#C4B5FD">integrations, workflows. On your machine.</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="22">
    <rect x="402" y="472" width="220" height="54" rx="11" fill="#1E0B36" stroke="#8B2FC9" stroke-opacity=".4"/>
    <text x="424" y="506" fill="#FFF3E2">mcy run</text>
    <rect x="638" y="472" width="150" height="54" rx="11" fill="#1E0B36" stroke="#8B2FC9" stroke-opacity=".4"/>
    <text x="660" y="506" fill="#FFF3E6">mcy learn</text>
    <rect x="804" y="472" width="196" height="54" rx="11" fill="#1E0B36" stroke="#FBBF24" stroke-opacity=".5"/>
    <text x="826" y="506" fill="#FBBF24">mcy serve</text>
  </g>
  <text x="402" y="580" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="20" fill="#A3E635">curl -fsSL https://mycelium.topta.co/mcy | sh</text>
  <text x="402" y="612" font-family="'Inter',sans-serif" font-size="17" fill="#5A6B62">Apache-2.0 · github.com/toptacos/mycelium</text>
</svg>
