[project]
name = "mycelium"
version = "0.1.0"
description = "Local-first agent workstation: scaffold, research, content, integrations, workflows. Learns locally, context-length conscious."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://mycelium.topta.co"
Repository = "https://github.com/toptacos/mycelium"
Changelog = "https://github.com/toptacos/mycelium/blob/main/CHANGELOG.md"

[project.scripts]
mcy = "mycelium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: hits a real model server and real sockets (slow, needs Ollama)",
    "slow: takes more than a few seconds",
    "e2e: subprocess end-to-end (spawns real CLIs/installers; slower)",
]
